<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Advocate Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@600;700&display=swap">
<style>
/* Layout: one header, four tabs, single column that widens to two on desktop. */
:root{--bg:#f4f6f3;--surface:#fff;--fg:#17211d;--muted:#5b6862;--line:#d9dfda;--accent:#0e5a52;--accent-fg:#fff;--soft:#e4efec;--warn:#7a4f00;--warn-bg:#fbf0d9;--bad:#a12622;--bad-bg:#f8e3e1;--ok:#1d6b3a;--ok-bg:#e0f1e5;
--serif:"Source Serif 4",Georgia,serif;--sans:"IBM Plex Sans",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1614;--surface:#17211e;--fg:#e6ece8;--muted:#9aa8a1;--line:#2a3833;--accent:#5cc4b5;--accent-fg:#08201c;--soft:#1b2f2b;--warn:#e8b45a;--warn-bg:#33290f;--bad:#f08a85;--bad-bg:#3a1a19;--ok:#6fd18f;--ok-bg:#143222;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1614;--surface:#17211e;--fg:#e6ece8;--muted:#9aa8a1;--line:#2a3833;--accent:#5cc4b5;--accent-fg:#08201c;--soft:#1b2f2b;--warn:#e8b45a;--warn-bg:#33290f;--bad:#f08a85;--bad-bg:#3a1a19;--ok:#6fd18f;--ok-bg:#143222;color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font:700 26px/1.2 var(--serif);margin:0}
h2{font:600 19px/1.3 var(--serif);margin:0 0 10px}
h3{font:600 15px var(--sans);margin:0 0 6px}
.sub{color:var(--muted);margin:2px 0 0}
nav{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:500 15px var(--sans);padding:10px 14px;cursor:pointer}
nav button[aria-selected=true]{color:var(--accent);border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{font:15px var(--sans);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;width:100%;min-width:0}
textarea{min-height:60px;resize:vertical}
.row{display:flex;gap:8px;align-items:flex-end}.row>label{flex:1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button.b{font:500 14px var(--sans);border-radius:6px;padding:8px 12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
button.p{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.d{color:var(--bad);border-color:var(--bad)}
button.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.item{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:6px}
.item:first-child{border-top:0}
.meta{color:var(--muted);font-size:13px;display:flex;gap:4px 14px;flex-wrap:wrap}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--accent)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.ok{background:var(--ok-bg);color:var(--ok)}
.banner{border-radius:6px;padding:10px 12px;font-size:13px;background:var(--soft)}.banner.bad{background:var(--bad-bg);color:var(--bad)}
.num{font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
.empty{color:var(--muted);padding:8px 0}
.tl{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}.tl .rule{grid-column:1/-1;color:var(--muted);font-size:12px}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;font:13px/1.5 var(--sans);margin:8px 0}
.small{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

<div class="wrap">
  <header>
    <h1>Advocate Desk</h1>
    <p class="sub">Case diary for all courts, limitation guide, cheque bounce timelines and fee ledger.</p>
  </header>
  <div id="banner"></div>
  <nav role="tablist" id="tabs"></nav>
  <main id="main"></main>
</div>

<script>
(function(){
var KEY='advocateDesk.v1', storageOK=true;
var S=load();
var ui={tab:'diary',editCase:null,editFee:null,filter:'',receipt:'',calc:null,flash:'',open:{},level:'',day:'',gq:'',gc:'',writDate:'',lim:{pick:'c1',order:'',applied:'',ready:'',extra:'',caseId:'',label:''}};

function norm(o){o=o||{};return{cases:Array.isArray(o.cases)?o.cases:[],fees:Array.isArray(o.fees)?o.fees:[],timelines:Array.isArray(o.timelines)?o.timelines:[]}}
function load(){try{var r=localStorage.getItem(KEY);if(r)return norm(JSON.parse(r))}catch(e){}return norm()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false}banner()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* ---------- dates (all UTC midnight, so no daylight-saving drift) ---------- */
function parse(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?Date.UTC(+m[1],+m[2]-1,+m[3]):null}
function iso(ms){return new Date(ms).toISOString().slice(0,10)}
function long(ms){return new Date(ms).toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'})}
function today(){var n=new Date();return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())}
function addDays(ms,n){return ms+n*86400000}
function addMonths(ms,n){var d=new Date(ms),y=d.getUTCFullYear(),m=d.getUTCMonth()+n,last=new Date(Date.UTC(y,m+1,0)).getUTCDate();return Date.UTC(y,m,Math.min(d.getUTCDate(),last))}
function diff(a,b){return Math.round((a-b)/86400000)}
function rel(ms){var d=diff(ms,today());if(d===0)return['Today','warn'];if(d===1)return['Tomorrow','warn'];if(d<0)return[(-d)+(d===-1?' day':' days')+' ago','bad'];return['in '+d+' days',d<=7?'warn':'']}
function inr(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})}

/* ---------- tiny DOM helper (user text always goes through textContent) ---------- */
function h(tag,a){var e=document.createElement(tag);a=a||{};for(var k in a){var v=a[k];if(k==='class')e.className=v;else if(k.indexOf('on')===0)e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v)}
 for(var i=2;i<arguments.length;i++){var c=arguments[i];if(Array.isArray(c)){c.forEach(function(x){if(x!=null&&x!==false)e.append(x.nodeType?x:document.createTextNode(x))})}else if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c))}return e}
function field(label,input){return h('label',{},label,input)}
function chip(t,cls){return h('span',{class:'chip '+(cls||'')},t)}
/* two-step delete: first click arms the button, second click inside 4 s confirms */
function danger(label,armedLabel,fn,cls){var t,b=h('button',{class:'b d '+(cls||''),type:'button',onclick:function(){if(b.classList.contains('armed')){clearTimeout(t);fn()}else{b.classList.add('armed');b.textContent=armedLabel;t=setTimeout(function(){b.classList.remove('armed');b.textContent=label},4000)}}},label);return b}
function flash(m){ui.flash=m;banner()}

function banner(){var b=document.getElementById('banner');b.replaceChildren();
 if(!storageOK)b.append(h('div',{class:'banner bad'},'This browser is blocking saving. Entries will be lost when you close the page. Use Backup in the Data tab.'));
 else b.append(h('div',{class:'banner'},ui.flash||'Your entries are saved in this browser only, never on a server. Make a Backup (Data tab) now and then.'));}

/* ---------- tabs ---------- */
var TABS=[['diary','Case diary'],['day','Day list'],['limit','Limitation'],['cheque','Cheque bounce'],['fees','Fees'],['data','Data']];
function render(){var t=document.getElementById('tabs');t.replaceChildren();
 TABS.forEach(function(x){t.append(h('button',{role:'tab','aria-selected':ui.tab===x[0],onclick:function(){ui.tab=x[0];ui.flash='';banner();render()}},x[1]))});
 var m=document.getElementById('main');m.replaceChildren(({diary:diary,day:dayList,limit:limitation,cheque:cheque,fees:fees,data:data})[ui.tab]());}

/* ================= CASE DIARY (all courts) ================= */
var LEVELS={trial:'District / trial court',hc:'High Court',sc:'Supreme Court',tri:'Tribunal / other'};
var LORDER={sc:0,hc:1,trial:2,tri:3};
var OUTC=['Heard','Adjourned','Order reserved','Order passed','Judgment','Disposed'];
function lv(c){return c.level||'trial'}
function courtLine(c){return [LEVELS[lv(c)],c.court].filter(Boolean).join(' · ')}
function allDeadlines(){var o=[];S.cases.forEach(function(c){(c.deadlines||[]).forEach(function(d){o.push({c:c,d:d})})});return o.sort(function(a,b){return (a.d.date||'9').localeCompare(b.d.date||'9')})}
function adjCount(c){return (c.log||[]).filter(function(x){return x.outcome==='Adjourned'}).length}
function itemNo(c){var n=parseInt(c.item,10);return isNaN(n)?99999:n}
function safeLong(s){var d=parse(s);return d==null?'No date':long(d)}

function caseItem(c){
 var d=parse(c.nextDate),r=d!=null?rel(d):null,adj=adjCount(c);
 var det=h('details',{ontoggle:function(){ui.open[c.id]=det.open}},h('summary',{class:'small',style:'cursor:pointer;margin-top:4px'},'Proceedings and deadlines'));
 det.open=!!ui.open[c.id];
 var lf={date:h('input',{id:'l_date_'+c.id,type:'date',value:iso(today())}),out:h('select',{id:'l_out_'+c.id},OUTC.map(function(x){return h('option',{value:x},x)})),note:h('input',{id:'l_note_'+c.id,type:'text',placeholder:'What happened'}),next:h('input',{id:'l_next_'+c.id,type:'date'})};
 var logBox=h('div',{style:'margin-top:8px'},h('h3',{},'Proceedings'),
  h('div',{class:'form'},field('Date',lf.date),field('Outcome',lf.out),field('Note',lf.note),field('Next date (optional)',lf.next)),
  h('div',{class:'actions'},
   h('button',{class:'b p',type:'button',onclick:function(){c.log=c.log||[];c.log.push({id:uid(),date:lf.date.value,outcome:lf.out.value,note:lf.note.value.trim(),next:lf.next.value});if(lf.next.value)c.nextDate=lf.next.value;ui.open[c.id]=true;save();render()}},'Add entry'),
   h('button',{class:'b',type:'button',onclick:function(){lf.note.value='';lf.next.value=''}},'Clear fields')));
 (c.log||[]).slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'')}).forEach(function(x){
  logBox.append(h('div',{class:'meta',style:'margin-top:8px;align-items:center'},h('span',{class:'num'},safeLong(x.date)),chip(x.outcome,x.outcome==='Adjourned'?'warn':''),x.note,x.next?'Next: '+safeLong(x.next):null,
   danger('Delete','Click again',function(){c.log=c.log.filter(function(y){return y.id!==x.id});ui.open[c.id]=true;save();render()})))});
 var dl={label:h('input',{id:'k_l_'+c.id,type:'text',placeholder:'e.g. Last day for appeal'}),date:h('input',{id:'k_d_'+c.id,type:'date'})};
 var dlBox=h('div',{style:'margin-top:14px'},h('h3',{},'Deadlines'),
  h('div',{class:'form'},field('Label',dl.label),field('Date',dl.date)),
  h('div',{class:'actions'},
   h('button',{class:'b p',type:'button',onclick:function(){if(!dl.date.value){dl.date.focus();flash('Choose a date for the deadline.');return}c.deadlines=c.deadlines||[];c.deadlines.push({id:uid(),label:dl.label.value.trim()||'Deadline',date:dl.date.value});ui.open[c.id]=true;save();render()}},'Add deadline'),
   h('button',{class:'b',type:'button',onclick:function(){dl.label.value='';dl.date.value=''}},'Clear fields')));
 (c.deadlines||[]).slice().sort(function(a,b){return (a.date||'').localeCompare(b.date||'')}).forEach(function(x){var xd=parse(x.date),xr=xd!=null?rel(xd):null;
  dlBox.append(h('div',{class:'meta',style:'margin-top:8px;align-items:center'},h('strong',{},x.label),h('span',{class:'num'},safeLong(x.date)),xr?chip(xr[0],xr[1]):null,
   danger('Delete','Click again',function(){c.deadlines=c.deadlines.filter(function(y){return y.id!==x.id});ui.open[c.id]=true;save();render()})))});
 det.append(logBox,dlBox);
 return h('div',{class:'item'},
  h('div',{},h('strong',{},c.title),' ',c.example?chip('Example','warn'):null,' ',adj?chip('Adjourned '+adj+(adj===1?' time':' times'),'warn'):null),
  h('div',{class:'meta'},chip(LEVELS[lv(c)]),c.court,c.bench&&('Bench: '+c.bench),c.item&&('Item '+c.item),[c.caseType,c.caseNo].filter(Boolean).join(' ')),
  h('div',{class:'meta'},c.client&&('Client: '+c.client),c.opp&&('Against: '+c.opp),c.stage&&('Stage: '+c.stage)),
  d!=null?h('div',{},'Next date: ',h('span',{class:'num'},long(d)),' ',chip(r[0],r[1])):h('div',{class:'small'},'No next date set'),
  c.notes?h('div',{class:'small'},c.notes):null,
  h('div',{class:'actions',style:'margin-top:2px'},
   h('button',{class:'b',type:'button',onclick:function(){ui.editCase=c.id;render();window.scrollTo(0,0)}},'Edit'),
   d!=null?h('button',{class:'b',type:'button',onclick:function(){c.nextDate='';save();render()}},'Clear date'):null,
   danger('Delete case','Click again to delete',function(){S.cases=S.cases.filter(function(x){return x.id!==c.id});save();render()})),
  det)}

function diary(){
 var e=ui.editCase?S.cases.filter(function(c){return c.id===ui.editCase})[0]:null;e=e||{};
 var f={};
 function inp(id,lab,type,val){f[id]=h('input',{id:'c_'+id,type:type||'text',value:val||''});return field(lab,f[id])}
 f.level=h('select',{id:'c_level'},Object.keys(LEVELS).map(function(k){var o=h('option',{value:k},LEVELS[k]);if(k===(e.level||'trial'))o.selected=true;return o}));
 f.notes=h('textarea',{id:'c_notes'});f.notes.value=e.notes||'';
 var dateRow=h('div',{class:'row'},inp('nextDate','Next hearing date','date',e.nextDate),h('button',{class:'b',type:'button',onclick:function(){f.nextDate.value=''}},'Clear date'));
 var keys=['title','client','opp','court','bench','item','caseType','caseNo','stage'];
 var form=h('div',{class:'card'},h('h2',{},e.id?'Edit case':'Add a case'),
  h('div',{class:'form'},inp('title','Case title','text',e.title),inp('client','Client','text',e.client),inp('opp','Opposite party','text',e.opp),field('Court level',f.level),inp('court','Court or place (e.g. Allahabad)','text',e.court),inp('bench','Bench / court room','text',e.bench),inp('item','Item / list number','text',e.item),inp('caseType','Case type (WP, Crl. Misc., SLP ...)','text',e.caseType),inp('caseNo','Case number','text',e.caseNo),inp('stage','Stage','text',e.stage),dateRow,field('Notes',f.notes)),
  h('div',{class:'actions'},
   h('button',{class:'b p',type:'button',onclick:function(){
     var o={id:e.id||uid(),example:e.example||false,log:e.log||[],deadlines:e.deadlines||[],level:f.level.value,nextDate:f.nextDate.value,notes:f.notes.value.trim()};
     keys.forEach(function(k){o[k]=f[k].value.trim()});
     if(!o.title){f.title.focus();flash('Enter a case title first.');return}
     if(e.id)S.cases=S.cases.map(function(c){return c.id===e.id?o:c});else S.cases.push(o);
     ui.editCase=null;save();flash('Case saved.');render()}},e.id?'Save changes':'Save case'),
   h('button',{class:'b',type:'button',onclick:function(){Object.keys(f).forEach(function(k){if(k!=='level')f[k].value=''})}},'Clear all fields'),
   e.id?h('button',{class:'b',type:'button',onclick:function(){ui.editCase=null;render()}},'Cancel edit'):null));
 var list=h('div',{class:'card'},h('h2',{},'All cases'));
 var filt=h('input',{id:'c_filter',type:'search',placeholder:'Title, client, court, number',value:ui.filter,oninput:function(){ui.filter=filt.value;fill()}});
 var lvs=h('select',{id:'c_lvfilter',onchange:function(){ui.level=lvs.value;fill()}},h('option',{value:''},'All courts'),Object.keys(LEVELS).map(function(k){var o=h('option',{value:k},LEVELS[k]);if(ui.level===k)o.selected=true;return o}));
 var box=h('div');list.append(h('div',{class:'form'},field('Search',filt),field('Show',lvs)),box);
 function fill(){box.replaceChildren();var q=(ui.filter||'').toLowerCase();
  var rows=S.cases.filter(function(c){return (!ui.level||lv(c)===ui.level)&&(!q||[c.title,c.client,c.opp,c.court,c.caseType,c.caseNo,c.stage].join(' ').toLowerCase().indexOf(q)>-1)});
  rows.sort(function(a,b){return (a.nextDate||'9999').localeCompare(b.nextDate||'9999')});
  if(!rows.length){box.append(h('p',{class:'empty'},S.cases.length?'No case matches.':'No cases yet. Add one, or load three clearly marked examples to see how it works.'));
   if(!S.cases.length)box.append(h('button',{class:'b',type:'button',onclick:loadExamples},'Load example entries'))}
  rows.forEach(function(c){box.append(caseItem(c))})}
 fill();
 var t0=today(),soon=[];
 S.cases.forEach(function(c){var d=parse(c.nextDate);if(d!=null&&diff(d,t0)>=0&&diff(d,t0)<=7)soon.push({ms:d,kind:'Hearing',title:c.title,sub:courtLine(c)});
  (c.deadlines||[]).forEach(function(x){var dd=parse(x.date);if(dd!=null&&diff(dd,t0)>=0&&diff(dd,t0)<=7)soon.push({ms:dd,kind:'Deadline',title:c.title,sub:x.label})})});
 soon.sort(function(a,b){return a.ms-b.ms});
 var week=h('div',{class:'card'},h('h2',{},'Next 7 days'),soon.length?soon.map(function(s){var r=rel(s.ms);return h('div',{class:'item'},h('div',{},chip(s.kind,s.kind==='Deadline'?'bad':''),' ',h('strong',{},s.title)),h('div',{class:'meta'},h('span',{class:'num'},long(s.ms)),chip(r[0],r[1]),s.sub))}):h('p',{class:'empty'},'Nothing due. This page cannot send alerts when closed, so open it each morning.'));
 return h('div',{class:'grid'},h('div',{style:'display:flex;flex-direction:column;gap:16px;min-width:0'},week,form),list)}

function loadExamples(){var t=today();
 [['Example: Sharma v. Verma (NI Act 138)','Client A','Verma','trial','Meerut','Court 12','7','CC','101/2026','Evidence',addDays(t,2)],['Example: Gupta v. State of U.P.','Client B','State of U.P.','hc','Allahabad','Court 34','112','Crl. Misc. (BNSS 528)','5523/2026','Admission',addDays(t,9)],['Example: Singh v. Rao','Client C','Rao','sc','New Delhi','Court 5','48','SLP (C)','9120/2026','Notice issued','']].forEach(function(x){
  S.cases.push({id:uid(),example:true,title:x[0],client:x[1],opp:x[2],level:x[3],court:x[4],bench:x[5],item:x[6],caseType:x[7],caseNo:x[8],stage:x[9],nextDate:x[10]?iso(x[10]):'',notes:'Example entry. Delete it or use Data > Delete examples.',log:[],deadlines:[]})});
 save();render()}

/* ================= DAY LIST (court-wise) ================= */
function dayList(){
 var d=ui.day||iso(today());
 var di=h('input',{id:'d_date',type:'date',value:d,onchange:function(){ui.day=di.value||iso(today());render()}});
 function shift(n){return function(){ui.day=iso(addDays(parse(d),n));render()}}
 var rows=S.cases.filter(function(c){return c.nextDate===d});
 var groups={};rows.forEach(function(c){var k=courtLine(c)+(c.bench?' · '+c.bench:'');(groups[k]=groups[k]||[]).push(c)});
 var keys=Object.keys(groups).sort(function(a,b){var ca=groups[a][0],cb=groups[b][0];return (LORDER[lv(ca)]-LORDER[lv(cb)])||a.localeCompare(b)});
 var dd=allDeadlines().filter(function(x){return x.d.date===d});
 var card=h('div',{class:'card'},h('h2',{},'Court-wise list'),
  h('div',{class:'row'},field('Date',di),h('button',{class:'b',type:'button',onclick:shift(-1)},'← Previous'),h('button',{class:'b',type:'button',onclick:shift(1)},'Next →'),h('button',{class:'b',type:'button',onclick:function(){ui.day=iso(today());render()}},'Today')),
  h('p',{class:'small'},d?long(parse(d)):''));
 if(keys.length>1)card.append(h('div',{class:'banner',style:'margin:8px 0'},'You have matters in '+keys.length+' different courts or benches on this date. Check that you can reach all of them.'));

/* ================= DATA: backup, restore, delete ================= */
function data(){
 var ex=S.cases.filter(function(c){return c.example}).length;
 var note=h('p',{class:'small',id:'dnote'},'');
 var file=h('input',{id:'restore',type:'file',accept:'.json,application/json'});
 var back=h('div',{class:'card'},h('h2',{},'Backup and restore'),
  h('p',{class:'small'},'You have '+S.cases.length+' cases, '+S.fees.length+' fee entries and '+S.timelines.length+' saved timelines. They live only in this browser.'),
  h('div',{class:'actions'},h('button',{class:'b p',type:'button',onclick:function(){
    saveBackup(note)}},'Download backup')),
  h('div',{style:'margin-top:14px'},field('Restore from a backup file (replaces what is here)',file)),
  h('div',{class:'actions'},h('button',{class:'b',type:'button',onclick:function(){var fl=file.files&&file.files[0];if(!fl){note.textContent='Choose a backup file first.';return}
    var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(typeof o!=='object'||o===null||!(Array.isArray(o.cases)||Array.isArray(o.fees)||Array.isArray(o.timelines)))throw 0;S=norm(o);save();flash('Backup restored.');render()}catch(x){note.textContent='That file is not a valid Advocate Desk backup.'}};r.readAsText(fl)}},'Restore')),note);
 function del(label,armed,fn){return h('div',{class:'row',style:'justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)'},h('span',{},label),danger('Delete',armed,fn))}

  del('All cases, with their proceedings and deadlines ('+S.cases.length+')','Click again',function(){S.cases=[];ui.editCase=null;save();flash('All cases deleted.');render()}),
  del('All fee entries ('+S.fees.length+')','Click again',function(){S.fees=[];ui.editFee=null;ui.receipt='';save();flash('All fee entries deleted.');render()}),
  del('All saved timelines ('+S.timelines.length+')','Click again',function(){S.timelines=[];save();flash('All timelines deleted.');render()}),
  del('Example entries only ('+ex+')','Click again',function(){S.cases=S.cases.filter(function(c){return !c.example});save();flash('Examples removed.');render()}),
  h('div',{class:'row',style:'justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)'},h('strong',{},'Everything'),danger('Delete everything','Click again to erase all',function(){S=norm();ui.editCase=ui.editFee=null;ui.receipt='';ui.calc=null;try{localStorage.removeItem(KEY)}catch(e){}save();flash('All data deleted.');render()})));
 return h('div',{class:'grid'},back,wipe)}

function saveBackup(note){
 var text=JSON.stringify(S,null,2),name='advocate-desk-backup-'+iso(today())+'.json';
 try{var url=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},2000);
  note.textContent='Backup requested. If no file was saved, copy the text below and keep it in a safe place.'}catch(e){note.textContent='Could not create a file. Copy the text below and keep it safe.'}
 var old=document.getElementById('backupText');if(old)old.remove();
 var ta=document.createElement('textarea');ta.id='backupText';ta.readOnly=true;ta.value=text;ta.style.marginTop='8px';ta.style.minHeight='90px';note.after(ta)}
banner();render();
})();
